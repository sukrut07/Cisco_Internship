version: "3.9"

services:
  backend:
    build: .
    container_name: netsage_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/netsage.db
      - AI_PROVIDER=mock
      - AI_API_KEY=
      - SECRET_KEY=dev-secret-change-in-production
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - netsage_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  netsage_data:
    driver: local
